name: Publish Comfy Node
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install comfy-cli from git
        run: pip install git+https://github.com/Comfy-Org/comfy-cli.git

      - name: Publish node to registry
        run: comfy node publish
        env:
          COMFY_REGISTRY_API_KEY: ${{ secrets.COMFY_REGISTRY_API_KEY }}
